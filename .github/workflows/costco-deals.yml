name: 好市多特價推播

on:
  schedule:
    # cron 使用 UTC：每天台灣時間 08:30 與 18:30 各檢查一次
    - cron: "30 0 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: costco-deals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: 檢查特價並推播
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_URL: ${{ vars.REPORT_URL }}
        run: python3 -m costco_deals

      - name: 儲存狀態與報表
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "資料無異動"
          else
            git commit -m "chore: 更新特價資料 $(TZ=Asia/Taipei date +%F)"
            git push
          fi

      - name: 失敗通知
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -fsS -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ 好市多特價檢查失敗：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
              "$DISCORD_WEBHOOK_URL"
          fi
